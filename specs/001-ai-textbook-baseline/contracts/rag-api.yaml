openapi: 3.0.0
info:
  title: AI-Native Textbook RAG API
  version: 1.0.0
paths:
  /chat:
    post:
      summary: Ask a question to the chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: The ID of the chat session. If not provided, a new session will be created.
                question:
                  type: string
                  description: The user's question.
                selected_text:
                  type: string
                  description: Optional highlighted text from the user.
      responses:
        '200':
          description: The chatbot's answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  session_id:
                    type: string
                    format: uuid
