name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - master # Or main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use the Node.js version compatible with your Docusaurus setup
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies ⚙️
        run: npm install
        working-directory: ./frontend

      - name: Build Docusaurus 🏗️
        run: npm run build
        working-directory: ./frontend

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          # This is the important part: it sets the base URL for Docusaurus to work with GitHub Pages
          # If your repo is https://github.com/username/reponame, and your GitHub Pages is at https://username.github.io/reponame/
          # Then the base_url should be /reponame/
          # For a project page, baseUrl is typically '/<repository-name>/'
          # For a user or organization page, baseUrl is typically '/'
          # For this project, assuming a project page deployment (user.github.io/reponame)
          # We'll set the baseUrl in docusaurus.config.js
